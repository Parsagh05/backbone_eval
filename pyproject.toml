[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backbone-eval"
version = "0.2.0"
description = "Backbone benchmarking for zero-shot anomaly detection (CLIP, SigLIP2)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "Pillow>=9.5",
  "scikit-image>=0.20",
  "scikit-learn>=1.2",
  "scipy>=1.10",
  "torch>=2.0",
  "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
clip = [
  "ftfy>=6.1",
  "regex>=2023.0",
  "clip @ git+https://github.com/openai/CLIP.git",
]
siglip2 = [
  "open-clip-torch>=2.31",
  "timm>=1.0.15",
]
corruptions = ["imagecorruptions>=1.1.2", "opencv-python>=4.8"]

[project.scripts]
bbeval = "bbeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
